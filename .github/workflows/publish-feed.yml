name: Publish RSS Feed

on:
  # The Worker dispatches this as soon as its 30-minute Cloudflare cron sees
  # new articles. GitHub's scheduler runs hours late, so it is only a backstop.
  repository_dispatch:
    types: [feed-updated]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'scripts/build-feed.js'
      - '.github/workflows/publish-feed.yml'

# Least privilege: only what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't let overlapping runs clobber each other's deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build feed
        # The source feed URL is kept in a repo secret (not in the code) so it
        # is masked in this public repo's logs. Forks must set their own.
        env:
          FEED_SOURCE_URL: ${{ secrets.FEED_SOURCE_URL }}
          # Articles the Worker saw when dispatching; empty on other triggers.
          EXPECTED_URLS: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.urls) || '' }}
        run: npm run build:feed

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
